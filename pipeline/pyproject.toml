[project]
name = "critters-pipeline"
version = "0.1.0"
description = "Data ingestion and normalization for Fantasy Congress Critters"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
critters = "pipeline.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
